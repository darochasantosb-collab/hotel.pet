<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #321b10, #60402c, #9a7254);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .caixa {
            width: 100%;
            max-width: 430px;
            background: #fffaf5;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .icone {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #6b4630;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .logo h1 { margin: 0; color: #4a2c1c; font-size: 32px; }
        .logo p { color: #806b5d; }
        h2 { text-align: center; color: #4a2c1c; }
        .campo { margin-bottom: 17px; }
        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #4a2c1c;
            font-weight: bold;
        }
        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cdb8a7;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .campo input:focus { border-color: #6b4630; }
        .botao {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #6b4630;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .botao:hover { background: #4a2c1c; }
        .mensagem {
            text-align: center;
            margin-top: 15px;
            color: #6b4630;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="logo">
            <div class="icone">🐾</div>
            <h1>Hotel Pet</h1>
            <p>Cuidando do seu melhor amigo</p>
        </div>

        <h2>Entrar</h2>
        <form id="formLogin">
            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="emailLogin" placeholder="Digite seu e-mail" required>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="senhaLogin" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="botao">Entrar</button>
        </form>
        <div id="msgLogin" class="mensagem"></div>
    </div>

<script>
/* LOGIN — Aceita QUALQUER e-mail e senha! */
document.getElementById("formLogin").onsubmit = function(event) {
    event.preventDefault();

    const email = document.getElementById("emailLogin").value.trim();
    const senha = document.getElementById("senhaLogin").value;

    if (email && senha.length >= 4) {
        localStorage.setItem("hotelPetLogado", "true");
        window.location.href = "usuarios/usuarios.html";
    } else {
        document.getElementById("msgLogin").innerText = "Digite um e-mail e senha com pelo menos 4 caracteres.";
    }
};
</script>
</body>
</html>
