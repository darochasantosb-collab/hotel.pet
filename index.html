<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #321b10, #60402c, #9a7254);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .caixa {
            width: 100%;
            max-width: 430px;
            background: #fffaf5;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .icone {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #6b4630;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .logo h1 { margin: 0; color: #4a2c1c; font-size: 32px; }
        .logo p { color: #806b5d; }
        h2 { text-align: center; color: #4a2c1c; }
        .campo { margin-bottom: 17px; }
        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #4a2c1c;
            font-weight: bold;
        }
        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cdb8a7;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .campo input:focus { border-color: #6b4630; }
        .botao {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #6b4630;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .botao:hover { background: #4a2c1c; }
        .link {
            width: 100%;
            margin-top: 15px;
            border: 0;
            background: transparent;
            color: #6b4630;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .mensagem {
            text-align: center;
            margin-top: 15px;
            color: #6b4630;
            font-weight: bold;
        }
        .escondido { display: none; }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="logo">
            <div class="icone">🐾</div>
            <h1>Hotel Pet</h1>
            <p>Cuidando do seu melhor amigo</p>
        </div>

        <div id="login">
            <h2>Entrar</h2>
            <form id="formLogin">
                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" id="emailLogin" placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" id="senhaLogin" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="botao">Entrar</button>
            </form>
            <button type="button" class="link" id="abrirCadastro">Criar conta</button>
            <div id="msgLogin" class="mensagem"></div>
        </div>

        <div id="cadastro" class="escondido">
            <h2>Criar conta</h2>
            <form id="formCadastro">
                <div class="campo">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Digite uma senha" required>
                </div>
                <div class="campo">
                    <label>Confirmar senha</label>
                    <input type="password" id="confirmar" placeholder="Digite a senha novamente" required>
                </div>
                <button type="submit" class="botao">Criar conta</button>
            </form>
            <button type="button" class="link" id="voltarLogin">Voltar para login</button>
            <div id="msgCadastro" class="mensagem"></div>
        </div>
    </div>

<script>
/* ABRIR CADASTRO */
document.getElementById("abrirCadastro").onclick = function() {
    document.getElementById("login").classList.add("escondido");
    document.getElementById("cadastro").classList.remove("escondido");
};

/* VOLTAR PARA LOGIN */
document.getElementById("voltarLogin").onclick = function() {
    document.getElementById("cadastro").classList.add("escondido");
    document.getElementById("login").classList.remove("escondido");
};

/* CRIAR CONTA */
document.getElementById("formCadastro").onsubmit = function(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    if (senha !== confirmar) {
        document.getElementById("msgCadastro").innerText = "As senhas não são iguais.";
        return;
    }

    if (senha.length < 4) {
        document.getElementById("msgCadastro").innerText = "A senha precisa ter pelo menos 4 caracteres.";
        return;
    }

    const usuario = { nome: nome, email: email, senha: senha };
    localStorage.setItem("hotelPetUsuario", JSON.stringify(usuario));

    document.getElementById("msgCadastro").innerText = "Conta criada com sucesso!";
    document.getElementById("emailLogin").value = email;
    document.getElementById("senhaLogin").value = "";

    setTimeout(function() {
        document.getElementById("cadastro").classList.add("escondido");
        document.getElementById("login").classList.remove("escondido");
    }, 1000);
};

/* LOGIN */
document.getElementById("formLogin").onsubmit = function(event) {
    event.preventDefault();

    const email = document.getElementById("emailLogin").value.trim().toLowerCase();
    const senha = document.getElementById("senhaLogin").value;
    const dados = localStorage.getItem("hotelPetUsuario");

    if (!dados) {
        document.getElementById("msgLogin").innerText = "Crie uma conta primeiro.";
        return;
    }

    const usuario = JSON.parse(dados);

    if (email === usuario.email && senha === usuario.senha) {
        localStorage.setItem("hotelPetLogado", "true");
        window.location.href = "usuarios/usuarios.html";
    } else {
        document.getElementById("msgLogin").innerText = "E-mail ou senha incorretos.";
    }
};
</script>
</body>
</html>
