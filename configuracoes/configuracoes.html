<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Configurações</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>Hotel Pet</h1>
        </div>
        <nav class="menu">
            <a href="../reserva/reserva.html">Reservas</a>
            <a href="../pets/pets.html">Pets</a>
            <a href="../usuarios/usuarios.html">Usuários</a>
            <a href="configuracoes.html">Configurações</a>
            <a href="#" onclick="sairDoSistema(); return false;">Sair</a>
        </nav>
    </header>

    <main class="conteudo">

        <div class="titulo-pagina">
            <h2>Configurações</h2>
            <p>Gerencie as configurações do Hotel Pet</p>
        </div>

        <section class="pesquisa">
            <h3>Dados do Hotel</h3>
            <div class="campo-pesquisa">
                <label>Nome do Hotel</label>
                <input type="text" id="nomeHotel" value="Hotel Pet">
            </div>
            <div class="campo-pesquisa">
                <label>Telefone</label>
                <input type="text" id="telefoneHotel" value="(77) 99999-9999">
            </div>
            <div class="campo-pesquisa">
                <label>E-mail</label>
                <input type="email" id="emailHotel" value="contato@hotelpet.com">
            </div>
            <div class="campo-pesquisa">
                <label>Endereço</label>
                <input type="text" id="enderecoHotel" value="Centro - Barreiras, BA">
            </div>
        </section>

        <section class="pesquisa">
            <h3>Configurações de Reserva</h3>
            <div class="campo-pesquisa">
                <label>Valor da diária</label>
                <input type="number" id="valorDiaria" value="80" min="0" step="0.01">
            </div>
            <div class="campo-pesquisa">
                <label>Horário de entrada</label>
                <input type="time" id="horarioEntrada" value="08:00">
            </div>
            <div class="campo-pesquisa">
                <label>Horário de saída</label>
                <input type="time" id="horarioSaida" value="18:00">
            </div>
        </section>

        <section class="pesquisa">
            <h3>Preferências</h3>
            <div class="campo-pesquisa">
                <label>Notificações</label>
                <select id="notificacao">
                    <option value="sim">Ativadas</option>
                    <option value="nao">Desativadas</option>
                </select>
            </div>
            <div class="campo-pesquisa">
                <label>Tema do sistema</label>
                <select id="tema">
                    <option value="claro">Claro</option>
                    <option value="escuro">Escuro</option>
                </select>
            </div>
        </section>

        <section class="pesquisa">
            <h3>Segurança — Alterar Senha</h3>
            <div class="campo-pesquisa">
                <label>Senha atual</label>
                <input type="password" id="senhaAtual" placeholder="Digite sua senha atual">
            </div>
            <div class="campo-pesquisa">
                <label>Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Crie sua nova senha">
            </div>
            <div class="campo-pesquisa">
                <label>Confirmar nova senha</label>
                <input type="password" id="confirmarSenha" placeholder="Digite a nova senha de novo">
            </div>
        </section>

        <div class="acoes">
            <button type="button" class="botao-editar" onclick="salvarConfiguracoes()">Salvar configurações</button>
            <button type="button" class="botao-visualizar" onclick="voltarInicio()">Voltar</button>
        </div>

    </main>

    <script>
        // Carregar configurações salvas ao abrir a página
        window.onload = function() {
            const config = localStorage.getItem("hotelPetConfig");
            if (config) {
                const cfg = JSON.parse(config);
                if (cfg.nomeHotel) document.getElementById("nomeHotel").value = cfg.nomeHotel;
                if (cfg.telefoneHotel) document.getElementById("telefoneHotel").value = cfg.telefoneHotel;
                if (cfg.emailHotel) document.getElementById("emailHotel").value = cfg.emailHotel;
                if (cfg.enderecoHotel) document.getElementById("enderecoHotel").value = cfg.enderecoHotel;
                if (cfg.valorDiaria) document.getElementById("valorDiaria").value = cfg.valorDiaria;
                if (cfg.horarioEntrada) document.getElementById("horarioEntrada").value = cfg.horarioEntrada;
                if (cfg.horarioSaida) document.getElementById("horarioSaida").value = cfg.horarioSaida;
                if (cfg.notificacao) document.getElementById("notificacao").value = cfg.notificacao;
                if (cfg.tema) document.getElementById("tema").value = cfg.tema;
            }
        };

        // Salvar configurações e ALTERAR SENHA com QUALQUER senha atual
        function salvarConfiguracoes() {
            const nome = document.getElementById("nomeHotel").value;
            const telefone = document.getElementById("telefoneHotel").value;
            const email = document.getElementById("emailHotel").value;
            const endereco = document.getElementById("enderecoHotel").value;
            const valor = document.getElementById("valorDiaria").value;
            const horarioEntrada = document.getElementById("horarioEntrada").value;
            const horarioSaida = document.getElementById("horarioSaida").value;
            const notificacao = document.getElementById("notificacao").value;
            const tema = document.getElementById("tema").value;

            const senhaAtual = document.getElementById("senhaAtual").value.trim();
            const novaSenha = document.getElementById("novaSenha").value.trim();
            const confirmarSenha = document.getElementById("confirmarSenha").value.trim();

            const dadosSalvos = localStorage.getItem("hotelPetUsuario");

            // Permite alterar senha com QUALQUER senha atual
            if (novaSenha || confirmarSenha || senhaAtual) {
                if (!senhaAtual) {
                    alert("Digite a senha atual.");
                    return;
                }
                if (!novaSenha) {
                    alert("Digite a nova senha.");
                    return;
                }
                if (!confirmarSenha) {
                    alert("Confirme a nova senha.");
                    return;
                }
                if (novaSenha !== confirmarSenha) {
                    alert("A nova senha e a confirmação não são iguais.");
                    return;
                }
                if (novaSenha.length < 4) {
                    alert("A nova senha precisa ter pelo menos 4 caracteres.");
                    return;
                }
                if (!dadosSalvos) {
                    alert("Crie uma conta primeiro para alterar a senha.");
                    return;
                }

                const usuario = JSON.parse(dadosSalvos);
                // ALTERA SENHA SEM CONFERIR A SENHA ATUAL
                usuario.senha = novaSenha;
                localStorage.setItem("hotelPetUsuario", JSON.stringify(usuario));
                alert("Senha alterada com sucesso!");
            }

            if (!nome || !telefone || !email || !valor) {
                alert("Preencha todos os campos obrigatórios.");
                return;
            }

            const configuracoes = {
                nomeHotel: nome,
                telefoneHotel: telefone,
                emailHotel: email,
                enderecoHotel: endereco,
                valorDiaria: valor,
                horarioEntrada: horarioEntrada,
                horarioSaida: horarioSaida,
                notificacao: notificacao,
                tema: tema
            };
            localStorage.setItem("hotelPetConfig", JSON.stringify(configuracoes));

            alert(
                "Configurações salvas com sucesso!\n\n" +
                "Hotel: " + nome +
                "\nTelefone: " + telefone +
                "\nE-mail: " + email +
                "\nValor da diária: R$ " + valor
            );
        }

        // Botão Voltar — volta para a página anterior
        function voltarInicio() {
            window.history.back();
        }

        // Botão Sair — volta para a página inicial
        function sairDoSistema() {
            window.location.href = "../index.html";
        }
    </script>

</body>
</html>
