<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Login</title>

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Hotel Pet</h1>

            <p>Gerenciamento de Hospedagem para Pets</p>

            <form>

                <div class="campo">
                    <label for="usuario">Usuário</label>

                    <input 
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input 
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >
                </div>

                <a href="../reserva/reserva.html" class="botao-entrar">
                    Entrar
                </a>

            </form>

        </div>

    </div>

</body>

</html>
