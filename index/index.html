<!-- LOGIN -->

<div id="login">

    <h2>Entrar</h2>

        <input
            type="email"
            id="emailLogin"
            placeholder="Digite seu e-mail"
            required
        >

        <input
            type="password"
            id="senhaLogin"
            placeholder="Digite sua senha"
            required

        <button type="submit">

    </form>


    <button
        type="button"
        class="link"
        id="abrirCadastro"
    >
        Criar conta
    </button>


    <div
        id="msgLogin"
        class="mensagem"
    ></div>

</div>



<!-- CADASTRO -->

<div
    id="cadastro"
    class="escondido"
>

    <h2>Criar conta</h2>

    <form id="formCadastro">

        <label>Nome</label>

        <input
            type="text"
            id="nome"

</div>

<script>


/* ABRIR CADASTRO */

document
    .getElementById("abrirCadastro")
    .onclick = function() {

        document
            .getElementById("login")
            .classList
            .add("escondido");

        document
            .getElementById("cadastro")
            .classList
            .remove("escondido");

    };



/* VOLTAR PARA LOGIN */

document
    .getElementById("voltarLogin")
    .onclick = function() {

        document
            .getElementById("cadastro")
            .classList
            .add("escondido");

        document
            .getElementById("login")
            .classList
            .remove("escondido");

    };



/* CRIAR CONTA */

document
    .getElementById("formCadastro")
    .onsubmit = function(event) {

        event.preventDefault();


        const nome =
            document.getElementById("nome").value.trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const senha =
            document.getElementById("senha").value;


        const confirmar =
            document
            .getElementById("confirmar")
            .value;


        if (senha !== confirmar) {

            document
                .getElementById("msgCadastro")
                .innerText =
                "As senhas não são iguais.";

            return;
        }


        if (senha.length < 4) {

            document
                .getElementById("msgCadastro")
                .innerText =
                "A senha precisa ter pelo menos 4 caracteres.";

            return;
        }


        const usuario = {

            nome: nome,
            email: email,
            senha: senha

        };


        localStorage.setItem(
            "hotelPetUsuario",
            JSON.stringify(usuario)
        );


        document
            .getElementById("msgCadastro")
            .innerText =
            "Conta criada com sucesso!";


        document
            .getElementById("emailLogin")
            .value = email;


        document
            .getElementById("senhaLogin")
            .value = "";


        setTimeout(function() {

            document
                .getElementById("cadastro")
                .classList
                .add("escondido");

            document
                .getElementById("login")
                .classList
                .remove("escondido");

        }, 1000);

    };



/* LOGIN */

document
    .getElementById("formLogin")
    .onsubmit = function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("emailLogin")
            .value
            .trim()
            .toLowerCase();


        const senha =
            document
            .getElementById("senhaLogin")
            .value;


        const dados =
            localStorage.getItem(
                "hotelPetUsuario"
            );


        if (!dados) {

            document
                .getElementById("msgLogin")
                .innerText =
                "Crie uma conta primeiro.";

            return;
        }


        const usuario =
            JSON.parse(dados);


        if (
            email === usuario.email &&
            senha === usuario.senha
        ) {

            localStorage.setItem(
                "hotelPetLogado",
                "true"
            );


            /*
              Depois do login,
              abre a página principal.
            */

            window.location.href =
                "index/index.html";

        } else {

            document
                .getElementById("msgLogin")
                .innerText =
                "E-mail ou senha incorretos.";

        }

    };

</script>

</body>
